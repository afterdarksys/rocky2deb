[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocky2deb"
version = "0.1.0"
description = "Plan Rocky and Debian migrations, convert source packages both ways, pack an unsigned source RPM, publish dnf metadata, bring one RPM onto Debian with rockify, and export Ubuntu or Debian archive source."
readme = "docs/plans/2026-10-03-rocky2deb-design.md"
requires-python = ">=3.11"

[project.scripts]
rocky2deb = "rocky2deb.cli:main"
rockify = "rocky2deb.rockify_cli:main"
debian2rocky = "rocky2deb.debian2rocky_cli:main"
ubuntu-exporter = "rocky2deb.ubuntu_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rocky2deb = ["data/*.toml", "data/maps/*.toml"]
